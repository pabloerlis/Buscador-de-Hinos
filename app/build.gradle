plugins { id 'com.android.application' }
def enableEmbeddings = providers.gradleProperty('enableEmbeddings').map { it.toBoolean() }.orElse(false).get()
// Valores incorporados ao APK: independentes de conexão e da biblioteca importada.
def sourceRevision = (System.getenv('BUILD_SOURCE_SHA') ?: System.getenv('GITHUB_SHA') ?: 'local').replaceAll('[^a-zA-Z0-9]', '')
def buildDateUtc = java.time.Instant.now().toString()
android {
    namespace 'br.com.buscadordehinos.app'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.buscadordehinos.app'
        minSdk 24
        targetSdk 34
        ndk { abiFilters 'arm64-v8a' }
        versionCode 74
        versionName '2.8.4'
        buildConfigField 'boolean', 'ENABLE_EMBEDDINGS', enableEmbeddings.toString()
        buildConfigField 'String', 'SOURCE_REVISION', '"' + (sourceRevision ?: 'local') + '"'
        buildConfigField 'String', 'BUILD_DATE_UTC', '"' + buildDateUtc + '"'
    }
    buildFeatures { buildConfig true }
    if (!enableEmbeddings) {
        androidResources { ignoreAssetsPatterns.addAll(['e5-model.onnx', 'e5-index.json', 'e5-vocab.bin', 'e5-source.txt']) }
    }
    androidResources { noCompress 'onnx' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1' }

// A build from the local workstation must not silently omit the lexical database.
tasks.register('verifyLexicalAsset') {
    doLast {
        def lexical = file('src/main/assets/lexical-pt.json')
        if (!lexical.isFile() || lexical.length() < 100000) {
            throw new GradleException('Base lexical ausente. Execute python3 scripts/build_lexical_pt.py na raiz do projeto.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyLexicalAsset') }

tasks.register('verifyHarrierTokenizer') {
    doLast {
        for (name in ['harrier-tokenizers.js', 'harrier-tokenizers-LICENSE.txt', 'harrier-conformance.json']) {
            if (!file('src/main/assets/' + name).isFile()) {
                throw new GradleException('Tokenizer ausente. Execute python3 scripts/prepare_harrier_tokenizer.py.')
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('verifyHarrierTokenizer') }
