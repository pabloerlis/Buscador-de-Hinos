plugins { id 'com.android.application' }
def enableLocalModels = providers.gradleProperty('enableLocalModels').map { it.toBoolean() }.orElse(false).get()
def optimizeGgufNative = providers.gradleProperty('optimizeGgufNative').map { it.toBoolean() }.orElse(true).get()
def enableLocalEmbeddings = providers.gradleProperty('enableLocalEmbeddings').map { it.toBoolean() }.orElse(false).get()
// O APK QA usa pacote independente; não substitui nem acessa dados de instalações anteriores.
def qaSidecar = providers.gradleProperty('qaSidecar').map { it.toBoolean() }.orElse(false).get()
def qaArm64Pilot = providers.gradleProperty('qaArm64Pilot').map { it.toBoolean() }.orElse(false).get()
def enableKleidiAI = providers.gradleProperty('enableKleidiAI').map { it.toBoolean() }.orElse(false).get()
if (qaArm64Pilot && !qaSidecar) throw new GradleException('Piloto ARM64 exige qaSidecar: nunca substituir o app principal.')
// Valores incorporados ao APK: independentes de conexão e da biblioteca importada.
def sourceRevision = (System.getenv('BUILD_SOURCE_SHA') ?: System.getenv('GITHUB_SHA') ?: 'local').replaceAll('[^a-zA-Z0-9]', '')
def buildDateUtc = java.time.Instant.now().toString()
android {
    namespace 'br.com.buscadordehinos.app'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'br.com.buscadordehinos.app'
        manifestPlaceholders = [hinosAppLabel: qaArm64Pilot ? 'Buscador de Hinos ARM64 QA' : qaSidecar ? 'Buscador de Hinos QA' : 'Buscador de Hinos']
        minSdk 24
        targetSdk 34
        ndk {
            abiFilters 'arm64-v8a'
            // ABI de teste adicional: APK aprovado é o mesmo instalado no emulador.
            if (enableLocalEmbeddings) abiFilters 'x86_64'
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        if (enableLocalModels) {
            externalNativeBuild {
                cmake {
                    arguments '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON', "-DHINOS_OPTIMIZE_NATIVE=${optimizeGgufNative ? 'ON' : 'OFF'}", "-DHINOS_ENABLE_KLEIDIAI=${enableKleidiAI ? 'ON' : 'OFF'}"
                }
            }
        }
        versionCode 35
        versionName '2.6.16'
        buildConfigField 'boolean', 'ENABLE_LOCAL_MODELS', enableLocalModels.toString()
        buildConfigField 'boolean', 'ENABLE_LOCAL_EMBEDDINGS', enableLocalEmbeddings.toString()
        buildConfigField 'String', 'SOURCE_REVISION', '"' + (sourceRevision ?: 'local') + '"'
        buildConfigField 'String', 'BUILD_DATE_UTC', '"' + buildDateUtc + '"'
    }
    buildTypes {
        debug {
            // A versão de QA é instalável lado a lado. Sem a propriedade, o app mantém o ID original.
            if (qaSidecar) applicationIdSuffix (qaArm64Pilot ? '.qa.arm64' : '.qa')
        }
    }
    buildFeatures { buildConfig true }
    if (enableLocalModels) {
        externalNativeBuild {
            cmake {
                path 'src/main/cpp/CMakeLists.txt'
                version '3.22.1'
            }
        }
    }
    // A variante E5 (sem GGUF) inclui o encoder e a biblioteca ONNX necessários
    // para inferência offline. O APK padrão continua sem nenhum modelo.
    if (!enableLocalEmbeddings && !enableLocalModels) {
        androidResources { ignoreAssetsPatterns.addAll(['e5-model.onnx', 'e5-index.json', 'e5-vocab.bin', 'e5-source.txt']) }
        packaging { jniLibs { excludes.add('**/libonnxruntime*.so') } }
    }
    androidResources { noCompress 'onnx' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
