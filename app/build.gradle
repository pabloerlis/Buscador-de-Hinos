plugins { id 'com.android.application' }
android {
    namespace 'br.com.buscadordehinos.app'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'br.com.buscadordehinos.app'
        minSdk 24
        targetSdk 34
        ndk { abiFilters (project.findProperty('smokeAbi') ?: 'arm64-v8a') }
        testInstrumentationRunner 'br.com.buscadordehinos.app.GgufSmokeRunner'
        versionCode 15
        versionName '2.3.0'
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    androidResources { noCompress 'onnx' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0' }
