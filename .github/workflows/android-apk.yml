name: Build Android APK
on:
  push:
    branches: [main, android-apk]
  workflow_dispatch:
jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo 'sdkmanager unavailable'; exit 1; fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Configure native Android SDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build licensed offline Bible index
        run: python3 scripts/build_scripture_index.py
      - name: Build biblical-topic and cross-reference graph
        run: python3 scripts/build_bible_graph.py
      - name: Reuse validated E5 assets from v2.0 (fallback to regeneration)
        id: reuse-e5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/buscador-e5
          if gh run download 44729929425 --repo "$GITHUB_REPOSITORY" --name "Buscador-de-Hinos-Android-debug" --dir /tmp/buscador-e5; then
            apk=/tmp/buscador-e5/app-debug.apk
            if test -f "$apk" && unzip -t "$apk" >/dev/null; then
              for file in e5-model.onnx e5-index.json e5-vocab.bin e5-source.txt; do
                unzip -p "$apk" "assets/$file" > "app/src/main/assets/$file"
              done
              echo 'reused=true' >> "$GITHUB_OUTPUT"
              echo 'Verified v2.0 E5 model and hymn vectors reused.'
            else
              echo 'reused=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'reused=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install vector indexing tools
        if: steps.reuse-e5.outputs.reused != 'true'
        run: python3 -m pip install --disable-pip-version-check 'huggingface_hub[hf_xet]>=0.34,<2' 'tokenizers>=0.20,<1' 'onnxruntime>=1.20,<2' 'numpy>=1.26,<3' 'requests>=2.32,<3'
      - name: Build E5 Small index and tokenizer
        if: steps.reuse-e5.outputs.reused != 'true'
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '240'
          HF_HUB_ETAG_TIMEOUT: '30'
        run: python3 scripts/build_e5_assets.py
      - name: Run local-search tests
        run: node tests/test-offline.js && node tests/test-gguf.js && node tests/test-v14.js && node tests/test-v15.js && node tests/test-v16.js && node tests/test-v17.js && node tests/test-v18.js && node tests/test-v19.js && node tests/test-v20.js && node tests/test-v21.js
      - name: Validate generated vector assets
        run: python3 scripts/verify_e5_assets.py
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Buscador-de-Hinos-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
