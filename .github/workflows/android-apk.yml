name: Android APK - verificacao por agentes
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    name: "Agente 1 | Fontes e licencas"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Gerar Biblia Livre (fonte fixada por hash)
        run: python3 scripts/build_scripture_index.py
      - name: Gerar grafo biblico (fontes fixadas)
        run: python3 scripts/build_bible_graph.py
      - name: Auditar proveniencia, integridade e cobertura
        run: python3 scripts/qa_sources.py
      - name: Compartilhar apenas indices biblicos licenciados
        uses: actions/upload-artifact@v4
        with:
          name: bible-indexes-qa
          path: |
            app/src/main/assets/scripture-pt.json
            app/src/main/assets/bible-graph.json
          retention-days: 1
          if-no-files-found: error

  static:
    name: "Agente 2 | Codigo e seguranca estatica"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe JavaScript de todos os arquivos
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find app/src/main/assets tests -type f -name '*.js' -print0)
      - name: Auditar interface, versao, licencas e bloqueio da compilacao
        run: python3 scripts/qa_static.py

  regressions:
    name: "Agente 3 | Testes funcionais de regressao"
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: bible-indexes-qa
          path: app/src/main/assets
      - name: Rodar todos os testes locais
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test-*.js; do
            echo "=== $test ==="
            node "$test"
          done

  relevance:
    name: "Agente 4 | Busca semantica e metricas"
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: bible-indexes-qa
          path: app/src/main/assets
      - name: Catalogo publico fixado para validacao (nunca no APK)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            'https://raw.githubusercontent.com/italozaina/projection-html5-icm/da8e75932982123301affce688e45b4152c9e06e/data/data.json' \
            --output /tmp/hinos-avaliacao.json
          test "$(wc -c < /tmp/hinos-avaliacao.json)" -gt 100000
      - name: Recall@10, Recall@20, nDCG@5 e exemplos analogos
        run: node tests/qa-metrics.js /tmp/hinos-avaliacao.json
      - name: Guardar metricas sem redistribuir letras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-metrics
          path: qa-report/metrics.json
          retention-days: 30
          if-no-files-found: ignore


  embeddings:
    name: "Agente 5 | E5, vetores por estrofe e proveniencia"
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias do encoder E5
        run: |
          python3 -m pip install --disable-pip-version-check -q \
            "numpy>=1.26,<3" "onnxruntime==1.20.1" "tokenizers==0.20.3" \
            "huggingface_hub>=0.27,<1" requests
      - name: Preparar modelo int8 pinado e gerar vetores por trecho
        run: python3 scripts/build_e5_assets.py
      - name: Verificar tokens Android contra tokenizer original
        run: python3 scripts/qa_e5_android_tokenizer.py
      - name: Auditar estrutura, origem, SHA e cobertura de estrofes
        run: python3 scripts/qa_e5.py
      - name: Medir recuperação E5 com consultas de diferentes narrativas
        run: python3 scripts/benchmark_e5.py
      - name: Registrar métricas de recuperação sem letras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-stanza-metrics
          path: qa-report/e5-metrics.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Preservar apenas os artefatos que entram no APK E5
        uses: actions/upload-artifact@v4
        with:
          name: e5-stanza-assets-qa
          path: |
            app/src/main/assets/e5-model.onnx
            app/src/main/assets/e5-vocab.bin
            app/src/main/assets/e5-index.json
            app/src/main/assets/e5-source.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  build_apk:
    name: "Compilar apenas se os 4 agentes aprovarem"
    needs: [sources, static, regressions, relevance, embeddings]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/download-artifact@v4
        with:
          name: bible-indexes-qa
          path: app/src/main/assets
      - uses: actions/download-artifact@v4
        with:
          name: e5-stanza-assets-qa
          path: app/src/main/assets
      - name: Compilar APK debug
        env:
          BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: gradle --no-daemon --stacktrace assembleDebug -PenableLocalEmbeddings=true
      - name: Guardar candidato para auditoria (ainda nao aprovado)
        uses: actions/upload-artifact@v4
        with:
          name: apk-candidate-qa
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error

  audit_apk:
    name: "Agente 5 | Auditar assinatura e APK final"
    needs: build_apk
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: apk-candidate-qa
          path: apk-candidate
      - name: Assinatura, versao, SHA, proveniencia, integridade
        env:
          BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECT_E5_EMBEDDINGS: 'true'
        run: python3 scripts/qa_apk.py apk-candidate/app-debug.apk
      - name: Identificar a versao do artefato
        id: meta
        shell: bash
        run: |
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publicar somente APK validado
        uses: actions/upload-artifact@v4
        with:
          name: Buscador-de-Hinos-v${{ steps.meta.outputs.version }}-QA-aprovado
          path: |
            apk-candidate/app-debug.apk
            qa-report/apk-audit.json
          retention-days: 90
          if-no-files-found: error
