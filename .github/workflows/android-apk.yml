name: Android APK - verificacao por agentes
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  QA_ANDROID_PACKAGE: br.com.buscadordehinos.app.qa
concurrency:
  group: verified-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sources:
    name: "Agente 1 | Fontes e licencas"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Gerar Biblia Livre (fonte fixada por hash)
        run: python3 scripts/build_scripture_index.py
      - name: Gerar grafo biblico (fontes fixadas)
        run: python3 scripts/build_bible_graph.py
      - name: Auditar proveniencia, integridade e cobertura
        run: python3 scripts/qa_sources.py
      - name: Compartilhar apenas indices biblicos licenciados
        uses: actions/upload-artifact@v4
        with:
          name: bible-indexes-qa
          path: |
            app/src/main/assets/scripture-pt.json
            app/src/main/assets/bible-graph.json
          retention-days: 1
          if-no-files-found: error

  static:
    name: "Agente 2 | Codigo e seguranca estatica"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe JavaScript de todos os arquivos
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find app/src/main/assets tests -type f -name '*.js' -print0)
      - name: Auditar interface, versao, licencas e bloqueio da compilacao
        run: python3 scripts/qa_static.py

  regressions:
    name: "Agente 3 | Testes funcionais de regressao"
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: bible-indexes-qa
          path: app/src/main/assets
      - name: Rodar todos os testes locais
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test-*.js; do
            echo "=== $test ==="
            node "$test"
          done

  relevance:
    name: "Agente 4 | Busca semantica e metricas"
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: bible-indexes-qa
          path: app/src/main/assets
      - name: Catalogo publico fixado para validacao (nunca no APK)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            'https://raw.githubusercontent.com/italozaina/projection-html5-icm/da8e75932982123301affce688e45b4152c9e06e/data/data.json' \
            --output /tmp/hinos-avaliacao.json
          test "$(wc -c < /tmp/hinos-avaliacao.json)" -gt 100000
      - name: Recall@10, Recall@20, nDCG@5 e exemplos analogos
        run: node tests/qa-metrics.js /tmp/hinos-avaliacao.json
      - name: Guardar metricas sem redistribuir letras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-metrics
          path: qa-report/metrics.json
          retention-days: 30
          if-no-files-found: ignore


  full_lyrics_qa:
    name: "Agente 11 | Evidencias das letras inteiras em 1.557 hinos"
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: bible-indexes-qa
          path: app/src/main/assets
      - name: Baixar catalogo temporario para auditoria das letras
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          curl --fail --location --retry 3 --max-time 120 \
            'https://raw.githubusercontent.com/italozaina/projection-html5-icm/da8e75932982123301affce688e45b4152c9e06e/data/data.json' \
            --output .tmp/catalog-2018.json
      - name: "Tres agentes independentes: texto integral, casos negativos e ranking"
        run: node tests/agents/run-validation.js .tmp/catalog-2018.json
      - name: Guardar laudos tecnico e resumido sem publicar letras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-lyrics-agents-qa
          path: |
            reports/validation/relatorio-completo.md
            reports/validation/relatorio-simples.md
            reports/validation/resultado-agentes.json
          retention-days: 90
          if-no-files-found: warn

  embeddings:
    name: "Agente 5 | E5, vetores por estrofe e proveniencia"
    needs: [sources, static]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias do encoder E5
        run: |
          python3 -m pip install --disable-pip-version-check -q \
            "numpy==1.26.4" "onnxruntime==1.20.1" "tokenizers==0.20.3" \
            "huggingface_hub==0.27.1" requests
      - name: Reconstruir o indice E5 do zero (sem cache para provar estabilidade)
        run: python3 scripts/build_e5_assets.py
      - name: Verificar tokens Android contra tokenizer original
        run: python3 scripts/qa_e5_android_tokenizer.py
      - name: Auditar estrutura, origem, SHA e cobertura de estrofes
        run: python3 scripts/qa_e5.py
      - name: Validar importação real e compatibilidade de hashes do E5
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            'https://raw.githubusercontent.com/italozaina/projection-html5-icm/da8e75932982123301affce688e45b4152c9e06e/data/data.json' \
            --output /tmp/e5-catalogo-verificado.json
          node tests/qa_e5_real_catalog.js /tmp/e5-catalogo-verificado.json
      - name: Medir recuperação E5 com consultas de diferentes narrativas
        run: python3 scripts/benchmark_e5.py
      - name: Comparar ranking híbrido real com o ranking anterior
        run: node tests/qa_e5_hybrid.js /tmp/e5-catalogo-verificado.json qa-report/e5-query-vectors.json
      - name: Vetorizar com ONNX real todas as 12 paráfrases (QA, nunca no APK)
        run: python3 scripts/qa_paraphrase_e5.py
      - name: Agente 5 - repetibilidade entre sessoes e entre builds
        run: python3 scripts/qa_e5_stability.py
      - uses: actions/download-artifact@v4
        with:
          name: bible-indexes-qa
          path: app/src/main/assets
      - name: Comparar ações e personagens com mecanismo ligado e desligado
        run: node tests/qa_event_ranking.js /tmp/e5-catalogo-verificado.json qa-report/e5-query-vectors.json
      - name: Medir RRF vs eventos A/B com catalogo e vetores identicos
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=fda52c2fe548f5fcbcdd2bd9ea2359f02c774bcf
          ALT_SHA=1dda4aeeab7d7de4941736f34eb5a86240840b79
          git fetch --no-tags --depth=1 origin "$BASE_SHA" "$ALT_SHA"
          git worktree add --detach /tmp/hinos-rrf "$BASE_SHA"
          git worktree add --detach /tmp/hinos-event-b "$ALT_SHA"
          node tests/qa_event_variant_matrix.js \
            /tmp/e5-catalogo-verificado.json qa-report/e5-query-vectors.json \
            /tmp/hinos-rrf/app/src/main/assets \
            "$PWD/app/src/main/assets" \
            /tmp/hinos-event-b/app/src/main/assets
      - name: Avaliar 50 consultas e comparar RRF com eventos sem misturar categorias
        shell: bash
        run: |
          set -euo pipefail
          node tests/qa_relevance_50.js \
            /tmp/e5-catalogo-verificado.json qa-report/e5-query-vectors.json \
            /tmp/hinos-rrf/app/src/main/assets \
            "$PWD/app/src/main/assets" \
            qa-report/e5-paraphrase-vectors.json
      - name: Registrar métricas de recuperação sem letras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-stanza-metrics
          path: |
            qa-report/e5-metrics.json
            qa-report/e5-hybrid.json
            qa-report/event-ranking.json
            qa-report/event-variant-matrix.json
            qa-report/relevance-50.json
            qa-report/e5-paraphrase-vectors.json
            qa-report/e5-stability.json
          retention-days: 30
          if-no-files-found: ignore
      - name: Guardar somente indice vetorial para diagnóstico de diferenças entre CPUs (sem letras)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-index-diagnostic
          path: app/src/main/assets/e5-index.json
          retention-days: 3
          if-no-files-found: ignore
      - name: Preservar apenas os artefatos que entram no APK E5
        uses: actions/upload-artifact@v4
        with:
          name: e5-stanza-assets-qa
          path: |
            app/src/main/assets/e5-model.onnx
            app/src/main/assets/e5-vocab.bin
            app/src/main/assets/e5-index.json
            app/src/main/assets/e5-source.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  semantic_search_qa:
    name: "Agente 9 | Testes independentes da busca semantica real"
    needs: [sources, embeddings]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: bible-indexes-qa
          path: app/src/main/assets
      - uses: actions/download-artifact@v4
        with:
          name: e5-stanza-assets-qa
          path: app/src/main/assets
      - uses: actions/download-artifact@v4
        with:
          name: e5-stanza-metrics
          path: qa-report
      - name: Baixar catalogo temporario pinado (nunca no APK)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 \
            'https://raw.githubusercontent.com/italozaina/projection-html5-icm/da8e75932982123301affce688e45b4152c9e06e/data/data.json' \
            --output /tmp/semantic-test-catalog.json
          test "$(wc -c < /tmp/semantic-test-catalog.json)" -gt 100000
      - name: Testes sinteticos - evidencias, modo off, numero e repertorio
        run: node tests/test-e5-api-integration.js
      - name: Testes de negação de eventos e fusao RRF
        shell: bash
        run: |
          set -euo pipefail
          node tests/test-event-frames.js
          node tests/test-rrf-fusion.js
      - name: Agente 9 - auditoria de hashes cross-build E5
        run: node tests/qa_e5_crossbuild_agent.js
      - name: Busca real E5 ON/OFF - 12 consultas, metricas, regressao e falsos positivos
        run: |
          node tests/qa_semantic_search_agent.js \
            /tmp/semantic-test-catalog.json \
            qa-report/e5-paraphrase-vectors.json \
            qa-report/relevance-50.json
      - name: Publicar relatorio de busca semantica sem letras
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-search-agent-qa
          path: qa-report/semantic-search-agent.json
          retention-days: 30
          if-no-files-found: ignore

  semantic_crossversion_qa:
    name: "Agente 10 | Regressao semantica entre versoes"
    needs: semantic_search_qa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: semantic-search-agent-qa
          path: qa-report
      - name: Autoteste do agente com exemplos positivos e negativos
        run: node tests/test-semantic-crossversion-gate.js
      - name: Agente 10 - conferir mudancas de posicao e metricas cross-version
        run: node tests/qa_semantic_crossversion_agent.js
      - name: Preservar laudo da decisao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-crossversion-agent-qa
          path: qa-report/semantic-crossversion-agent.json
          retention-days: 90
          if-no-files-found: ignore

  build_apk:
    name: "Compilar apenas se agentes de testes aprovarem"
    needs: [sources, static, regressions, relevance, embeddings, semantic_search_qa, semantic_crossversion_qa, full_lyrics_qa]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/download-artifact@v4
        with:
          name: bible-indexes-qa
          path: app/src/main/assets
      - uses: actions/download-artifact@v4
        with:
          name: e5-stanza-assets-qa
          path: app/src/main/assets
      - uses: actions/download-artifact@v4
        with:
          name: e5-stanza-metrics
          path: qa-report
      - name: Gerar referencia E5 ONNX 384D apenas para os testes Android
        run: python3 scripts/qa_android_query_canary.py qa-report/e5-paraphrase-vectors.json app/src/androidTest/assets/e5-query-canary.json
      - name: Preparar a entrada GGUF a partir do código da interface
        run: node scripts/build_lfm3_qa_fixture.js
      - name: Compilar baseline nativa Debug sem -O3 para comparação isolada
        env:
          BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest -PenableLocalEmbeddings=true -PenableLocalModels=true -PoptimizeGgufNative=false -PqaStandalone=true
          mkdir -p qa-baseline
          cp app/build/outputs/apk/debug/app-debug.apk qa-baseline/app-debug.apk
          python3 scripts/qa_native_compile_flags.py --mode baseline
      - name: Guardar APK baseline apenas como controle de desempenho
        uses: actions/upload-artifact@v4
        with:
          name: apk-baseline-native-qa
          path: qa-baseline/app-debug.apk
          retention-days: 1
          if-no-files-found: error
      - name: Compilar APK debug com os kernels nativos otimizados
        env:
          BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest -PenableLocalEmbeddings=true -PenableLocalModels=true -PoptimizeGgufNative=true -PqaStandalone=true
      - name: Auditar compile_commands.json REAL ARM64 e x86_64 (bloqueante)
        run: python3 scripts/qa_native_compile_flags.py --mode optimized
      - name: Publicar comandos e flags efetivos de ambas as compilações
        uses: actions/upload-artifact@v4
        with:
          name: native-build-evidence-qa
          path: |
            qa-report/native-flags-baseline.json
            qa-report/native-flags-optimized.json
          retention-days: 30
          if-no-files-found: error
      - name: Guardar candidato para auditoria (ainda nao aprovado)
        uses: actions/upload-artifact@v4
        with:
          name: apk-candidate-qa
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error
      - name: Guardar APK dos testes instrumentados
        uses: actions/upload-artifact@v4
        with:
          name: apk-instrumentation-qa
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 1
          if-no-files-found: error

  device_smoke:
    name: "Agente 6 | Android real: WebView, sobre e E5 ONNX"
    needs: build_apk
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-candidate-qa
          path: apk-candidate
      - uses: actions/download-artifact@v4
        with:
          name: apk-instrumentation-qa
          path: apk-instrumentation
      - name: Baixar APK anterior para verificar instalação lado a lado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download v2.6.15-qa --pattern Buscador-de-Hinos-2.6.15.apk --dir qa-previous
          printf '%s  %s\n' 750fc47db77e061bbe5efc6f629dbac76e2fe831010afd35a824a296f804f86b qa-previous/Buscador-de-Hinos-2.6.15.apk | sha256sum --check --strict
      - name: Habilitar acesso à virtualização Android KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar E5 na interface Android do próprio APK aprovado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/qa_android_emulator.sh
      - name: Guardar evidência efetiva dos testes instrumentados
        uses: actions/upload-artifact@v4
        with:
          name: android-device-evidence-qa
          path: qa-report/android-device-evidence.log
          retention-days: 30
          if-no-files-found: error

  lfm3_model_qa:
    name: "Agente 12 | GGUF LFM3 oficial no Android JNI"
    needs: [build_apk, device_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-candidate-qa
          path: apk-candidate
      - uses: actions/download-artifact@v4
        with:
          name: apk-instrumentation-qa
          path: apk-instrumentation
      - uses: actions/download-artifact@v4
        with:
          name: apk-baseline-native-qa
          path: apk-baseline
      - uses: actions/download-artifact@v4
        with:
          name: native-build-evidence-qa
          path: qa-report
      - name: Reutilizar modelo oficial por hash exato (somente CI; nunca no APK)
        id: gguf-cache
        uses: actions/cache@v4
        with:
          path: /tmp/LFM3-1.7B-QAD-Q4_0.gguf
          key: official-lfm3-17b-qad-q4-0-sha256-43a7d09a0e9cba91b63eb7052488b9564569bddfd65754d2e426465e572a7452
      - name: Baixar GGUF LFM3 oficial somente se ausente do cache
        if: steps.gguf-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 3 --connect-timeout 30 \
            --max-time 1200 \
            'https://huggingface.co/LiquidAI/LFM3-1.7B-GGUF/resolve/main/LFM3-1.7B-QAD-Q4_0.gguf' \
            --output /tmp/LFM3-1.7B-QAD-Q4_0.gguf
          echo "43a7d09a0e9cba91b63eb7052488b9564569bddfd65754d2e426465e572a7452  /tmp/LFM3-1.7B-QAD-Q4_0.gguf" | sha256sum --check
      - name: Confirmar SHA-256 do GGUF oficial, inclusive quando veio do cache
        run: echo "43a7d09a0e9cba91b63eb7052488b9564569bddfd65754d2e426465e572a7452  /tmp/LFM3-1.7B-QAD-Q4_0.gguf" | sha256sum --check
      - name: Habilitar KVM no emulador
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar o APK completo e inferir com o GGUF oficial no Android offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/qa_lfm3_android_emulator.sh
      - name: Guardar evidência Android LFM3 real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfm3-android-evidence-qa
          path: |
            qa-report/lfm3-device-evidence.log
            qa-report/lfm3-native-benchmark.json
            qa-report/lfm3-memory-baseline.txt
            qa-report/lfm3-memory-optimized.txt
          retention-days: 30
          if-no-files-found: ignore

  audit_apk:
    name: "Agente 7 | Auditoria do APK validado em Android"
    needs: [build_apk, device_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ferramentas Android
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: apk-candidate-qa
          path: apk-candidate
      - name: Assinatura, versao, SHA, proveniencia, integridade
        env:
          BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECT_E5_EMBEDDINGS: 'true'
          EXPECT_GGUF_ENGINE: 'true'
        run: python3 scripts/qa_apk.py apk-candidate/app-debug.apk
      - name: Preservar laudo de assinatura para revisão independente
        uses: actions/upload-artifact@v4
        with:
          name: apk-audit-qa
          path: qa-report/apk-audit.json
          retention-days: 30
          if-no-files-found: error

  independent_review:
    name: "Agente 8 | Testes independentes e analise critica da entrega"
    needs: [audit_apk, device_smoke, lfm3_model_qa, relevance, embeddings, semantic_search_qa, semantic_crossversion_qa]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: apk-candidate-qa
          path: apk-candidate
      - uses: actions/download-artifact@v4
        with:
          name: quality-metrics
          path: qa-report
      - uses: actions/download-artifact@v4
        with:
          name: e5-stanza-metrics
          path: qa-report
      - uses: actions/download-artifact@v4
        with:
          name: apk-audit-qa
          path: qa-report
      - uses: actions/download-artifact@v4
        with:
          name: android-device-evidence-qa
          path: qa-report
      - uses: actions/download-artifact@v4
        with:
          name: semantic-search-agent-qa
          path: qa-report
      - uses: actions/download-artifact@v4
        with:
          name: native-build-evidence-qa
          path: qa-report
      - uses: actions/download-artifact@v4
        with:
          name: lfm3-android-evidence-qa
          path: qa-report
      - name: Agente independente - validar flags reais e benchmark LFM3
        run: python3 scripts/qa_native_performance_gate.py
      - name: Testar novamente casos narrativos negativos e fusao
        shell: bash
        run: |
          set -euo pipefail
          node tests/test-event-frames.js
          node tests/test-rrf-fusion.js
      - uses: actions/download-artifact@v4
        with:
          name: full-lyrics-agents-qa
          path: reports/validation
      - name: Confirmar 100% dos testes de letra inteira
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('reports/validation/resultado-agentes.json').read_text())
          assert result['status']=='PASS', 'Agentes de letra inteira não aprovaram'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: semantic-crossversion-agent-qa
          path: qa-report
      - name: Validar parecer bloqueante do agente 10
        run: python3 -c "import json; r=json.load(open('qa-report/semantic-crossversion-agent.json')); assert r['agent']=='10-semantic-crossversion-qa' and r['decision']=='approved' and r['evaluated_cases']==12 and not r['errors']"
      - name: Revisar realmente o APK e recalcular metricas caso a caso
        env:
          BUILD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/qa_independent_review.py apk-candidate/app-debug.apk
      - name: Publicar relatorio da decisao independente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-review-qa
          path: qa-report/independent-review.json
          retention-days: 90
          if-no-files-found: ignore

  publish_apk:
    name: "Entrega | APK liberado apenas apos pareceres dos agentes"
    needs: [audit_apk, independent_review]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apk-candidate-qa
          path: apk-candidate
      - uses: actions/download-artifact@v4
        with:
          name: apk-audit-qa
          path: qa-report
      - uses: actions/download-artifact@v4
        with:
          name: independent-review-qa
          path: qa-report
      - uses: actions/download-artifact@v4
        with:
          name: android-device-evidence-qa
          path: qa-report
      - uses: actions/download-artifact@v4
        with:
          name: full-lyrics-agents-qa
          path: reports/validation
      - uses: actions/download-artifact@v4
        with:
          name: semantic-crossversion-agent-qa
          path: qa-report
      - uses: actions/download-artifact@v4
        with:
          name: lfm3-android-evidence-qa
          path: qa-report
      - uses: actions/download-artifact@v4
        with:
          name: native-build-evidence-qa
          path: qa-report
      - name: Verificar que o agente independente aprovou antes da publicação
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          review=json.loads(Path('qa-report/independent-review.json').read_text())
          assert review['decision']=='approved' and not review['errors'], 'Agente 8 não aprovou o APK'
          audit=json.loads(Path('qa-report/apk-audit.json').read_text())
          assert audit['passed'] is True and review['apk']['sha256']==audit['sha256']
          assert audit.get('local_e5_embedded') is True, 'E5 removido do APK'
          assert audit.get('local_gguf_engine_embedded') is True, 'Motor GGUF removido do APK'
          gate=json.loads(Path('qa-report/semantic-crossversion-agent.json').read_text())
          assert gate['decision']=='approved' and not gate['errors'], 'Agente 10 reprovou'
          assert Path('apk-candidate/app-debug.apk').is_file()
          perf=json.loads(Path('qa-report/lfm3-native-benchmark.json').read_text())
          assert perf['passed'] is True and perf['baseline']['simple']['total_ms']>0 and perf['optimized']['simple']['total_ms']>0 and perf['optimized']['compare-five']['total_ms']>0
          assert perf['baseline']['compare-five'].get('timed_out', False) or perf['baseline']['compare-five'].get('total_ms', 0)>0
          for mode in ('baseline', 'optimized'):
            assert json.loads(Path(f'qa-report/native-flags-{mode}.json').read_text())['passed'] is True
          PY
      - name: Identificar a versao do artefato
        id: meta
        shell: bash
        run: |
          version="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publicar APK aprovado para entrega ao usuário
        uses: actions/upload-artifact@v4
        with:
          name: Buscador-de-Hinos-v${{ steps.meta.outputs.version }}-QA-aprovado
          path: |
            apk-candidate/app-debug.apk
            qa-report/apk-audit.json
            qa-report/independent-review.json
            qa-report/semantic-crossversion-agent.json
            qa-report/android-device-evidence.log
            qa-report/lfm3-device-evidence.log
            qa-report/lfm3-native-benchmark.json
            qa-report/native-flags-baseline.json
            qa-report/native-flags-optimized.json
            reports/validation/relatorio-completo.md
            reports/validation/relatorio-simples.md
          retention-days: 90
          if-no-files-found: error
