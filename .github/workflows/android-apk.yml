name: Build Android APK
on:
  push:
    branches: [main, android-apk, 'test/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo 'sdkmanager unavailable'; exit 1; fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build licensed offline Bible index
        run: python3 scripts/build_scripture_index.py
      - name: Build biblical-topic and cross-reference graph
        run: python3 scripts/build_bible_graph.py
      - name: Run local-search tests
        run: node tests/test-offline.js && node tests/test-gguf.js && node tests/test-v14.js && node tests/test-v15.js && node tests/test-v16.js && node tests/test-v17.js && node tests/test-v18.js && node tests/test-v19.js && node tests/test-v20.js && node tests/test-v21.js
      - name: Evaluate offline semantic ranking
        run: node tests/test-stanza-ranking.js
      - name: Download real hymn catalog for independent agents
        run: |
          mkdir -p .tmp
          curl --fail --location --retry 3 --max-time 120 \
            'https://raw.githubusercontent.com/italozaina/projection-html5-icm/master/data/data.json' \
            --output .tmp/catalog-2018.json
      - name: Three agents validate complete lyrics before APK
        run: node tests/agents/run-validation.js .tmp/catalog-2018.json
      - name: Upload complete and simple semantic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Relatorios-Testes-Semanticos-Letra-Inteira
          path: |
            reports/validation/relatorio-completo.md
            reports/validation/relatorio-simples.md
            reports/validation/resultado-agentes.json
          if-no-files-found: warn
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify model-free APK contents
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          entries="$(unzip -Z1 "$apk")"
          grep -Fx 'assets/scripture-pt.json' <<< "$entries"
          grep -Fx 'assets/bible-graph.json' <<< "$entries"
          if grep -E '(^assets/e5-|/lib(hinosllm|onnxruntime[^/]*)\.so$)' <<< "$entries"; then
            echo 'Unexpected AI assets or inference libraries in default APK.'
            exit 1
          fi
          du -h "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Buscador-de-Hinos-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
