name: Laya treinamento real 1440 — externo sem APK
on:
  push:
    branches: [experiment/laya-1440-real-finetune-20261123]
    paths:
      - scripts/qa_laya_1440_finetune.py
      - .github/workflows/laya-1440-real-finetune.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  train_laya_1440:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    name: "Laya CPU real 1440 | 288 dev | 31 historicos"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias CPU fixadas
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "laya==0.4.20" "transformers==4.57.3" "huggingface-hub>=0.34,<1.0"
          python -c "import laya; from laya.train import TrainConfig,finetune; print('laya:',laya.__version__)"
      - name: Baixar base auditada de execução fixa e independente
        uses: actions/download-artifact@v4
        with:
          name: laya-1440-dataset-reviewed
          run-id: 45257257213
          github-token: ${{ github.token }}
          path: .tmp/reviewed
      - name: Baixar classificacoes historicas do Laya original
        uses: actions/download-artifact@v4
        with:
          name: laya-multilingual-real-benchmark
          run-id: 45247089241
          github-token: ${{ github.token }}
          path: .tmp/original
      - name: Baixar comparacao do ajuste anterior de 144 exemplos
        uses: actions/download-artifact@v4
        with:
          name: laya-small-finetune-metrics
          run-id: 45250033366
          github-token: ${{ github.token }}
          path: .tmp/small
      - name: Baixar catalogo apenas para avaliacao, nunca para treinamento
        run: |
          set -euo pipefail
          mkdir -p .tmp
          curl --fail --location --retry 3 --max-time 120 \
            'https://raw.githubusercontent.com/italozaina/projection-html5-icm/da8e75932982123301affce688e45b4152c9e06e/data/data.json' \
            --output .tmp/catalog.json
          test "$(wc -c < .tmp/catalog.json)" -gt 100000
      - name: Reconstruir metadata de avaliacao e verificar hashes da base congelada
        run: |
          set -euo pipefail
          python scripts/qa_laya_1440_generator.py --out .tmp/generated
          python scripts/agents/review_laya_dataset.py \
            --data .tmp/generated \
            --historical-catalog .tmp/catalog.json \
            --report qa-report/laya-1440-run-audit.json --strict
          python - <<'PY'
          import hashlib,pathlib
          for name in ("train.jsonl","dev.jsonl","manifest.json"):
              frozen=pathlib.Path(".tmp/reviewed")/name
              recreated=pathlib.Path(".tmp/generated")/name
              assert frozen.is_file() and recreated.is_file(),name
              assert hashlib.sha256(frozen.read_bytes()).digest()==hashlib.sha256(recreated.read_bytes()).digest(),f"Changed {name}"
              print("Frozen audited file verified:",name,flush=True)
          assert (pathlib.Path(".tmp/reviewed")/"audit.json").is_file()
          PY
      - name: Fine-tune REAL no CPU e avaliar original/144/1440 com holdout
        env:
          OMP_NUM_THREADS: "4"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
          USE_TF: "0"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python scripts/qa_laya_1440_finetune.py \
            --train .tmp/reviewed/train.jsonl \
            --dev .tmp/reviewed/dev.jsonl \
            --dev-meta .tmp/generated/dev.audit.jsonl \
            --manifest .tmp/reviewed/manifest.json \
            --catalog .tmp/catalog.json \
            --baseline .tmp/original/laya-multilingual-real.json \
            --previous-small .tmp/small/laya-small-finetune.json \
            --checkpoint .tmp/laya-1440/checkpoint \
            --output qa-report/laya-1440-finetune-result.json
      - name: Publicar as metricas e status sem letras reais nem pesos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laya-1440-finetune-metrics
          path: |
            qa-report/laya-1440-finetune-result.json
            qa-report/laya-1440-approval.txt
            qa-report/laya-1440-run-audit.json
          retention-days: 90
          if-no-files-found: warn
      - name: Exportar pesos SOMENTE como arquivo externo se aprovado
        if: success()
        run: |
          set -euo pipefail
          if grep -qx approved qa-report/laya-1440-approval.txt; then
            mkdir -p external-model
            cp -R .tmp/laya-1440/checkpoint external-model/laya-hinos-1440
            printf '%s\n' 'checkpoint externo; modelo deve ser apontado separadamente no dispositivo' > external-model/README.txt
          else
            echo "Nao aprovado: nao publicar pesos, manter apenas metricas."
          fi
      - name: Upload opcional de checkpoint externo aprovado (nunca no APK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: laya-hinos-1440-checkpoint-externo
          path: external-model/
          retention-days: 30
          if-no-files-found: ignore
