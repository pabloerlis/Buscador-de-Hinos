name: Entregar APK 2.6.15 verificado
on:
  push:
    branches: ['delivery/apk-2.6.15-87090a7']

permissions:
  actions: read
  contents: write

concurrency:
  group: apk-delivery-2.6.15
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: '87090a7b4aec51f21bbe6701c84e056a4912e61e'
      APK_SHA: '750fc47db77e061bbe5efc6f629dbac76e2fe831010afd35a824a296f804f86b'
      APK_NAME: 'Buscador-de-Hinos-2.6.15.apk'
      RELEASE_TAG: 'v2.6.15-qa'
    steps:
      - name: Confirmar que a origem foi aprovada no repositório privado
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO" --jq .private)" = true
          gh api "repos/$GH_REPO/actions/runs/44959496866" |
            jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .conclusion == "success"'
          gh api "repos/$GH_REPO/actions/artifacts/14729735614" |
            jq -e --arg sha "$SOURCE_SHA" '.workflow_run.head_sha == $sha and .expired == false and .name == "Buscador-de-Hinos-v2.6.15-QA-aprovado"'
      - name: Extrair o pacote aprovado
        uses: actions/download-artifact@v4
        with:
          name: Buscador-de-Hinos-v2.6.15-QA-aprovado
          run-id: 44959496866
          github-token: ${{ github.token }}
          path: verified
      - name: Conferir o APK contra o laudo e disponibilizar o arquivo
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find verified -type f -name app-debug.apk)
          test "${#candidates[@]}" -eq 1
          cp -- "${candidates[0]}" "$APK_NAME"
          test "$(wc -c < "$APK_NAME")" -eq 193630934
          printf '%s  %s\n' "$APK_SHA" "$APK_NAME" | sha256sum --check --strict
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            cat > release-notes.md <<'EOF'
          APK de QA 2.6.15 (versionCode 34), extraído sem recompilar da execução aprovada #344 no commit 87090a7.
          SHA-256: `750fc47db77e061bbe5efc6f629dbac76e2fe831010afd35a824a296f804f86b`.
          A instalação como atualização depende da assinatura da versão já instalada. Veja a issue #35.
          EOF
            gh release create "$RELEASE_TAG" "$APK_NAME" --prerelease --latest=false \
              --target "$SOURCE_SHA" --title "Buscador de Hinos 2.6.15 (QA)" --notes-file release-notes.md
          fi
          gh release view "$RELEASE_TAG" --json isPrerelease,targetCommitish |
            jq -e --arg sha "$SOURCE_SHA" '.isPrerelease and .targetCommitish == $sha'
          mkdir -p downloaded
          gh release download "$RELEASE_TAG" --pattern "$APK_NAME" --dir downloaded
          printf '%s  %s\n' "$APK_SHA" "downloaded/$APK_NAME" | sha256sum --check --strict
