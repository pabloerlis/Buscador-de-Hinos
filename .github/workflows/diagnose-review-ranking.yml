name: Identificar execução de diagnóstico LFM3
on:
  push:
    branches: ['diagnostics/filho-prodigo-inferencia-2619']
permissions:
  actions: read
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Localizar execução anterior
        shell: bash
        run: |
          set -euo pipefail
          id="$(gh api 'repos/pabloerlis/Buscador-de-Hinos/actions/runs?head_sha=a961692df960a8ddc6e0eaa77239cd61d2c5a863' --jq '[.workflow_runs[] | select(.head_sha=="a961692df960a8ddc6e0eaa77239cd61d2c5a863")][0].id')"
          [[ "$id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" --jq '{run_id:([.jobs[].run_id][0]),jobs:[.jobs[]|{id,name,status,conclusion,steps:[.steps[]|{name,status,conclusion}]}]}' >/tmp/status.json
          cat /tmp/status.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/qa/status-revisao-filho-prodigo-2619.json" \
            -f branch="$GITHUB_REF_NAME" -f message='Localiza diagnóstico inicial de inferência no catálogo' \
            -f content="$(base64 -w0 /tmp/status.json)"
