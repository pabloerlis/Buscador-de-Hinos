name: Teste de GGUF em Android x86_64
on:
  push:
    branches: [diagnostics/gguf-emulator]
permissions:
  contents: read
jobs:
  emulator:
    name: GGUF / ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: Qwen3.5-2B-Q4_K_M
            expected: generate
            url: https://huggingface.co/gguf/Qwen3.5-2B-GGUF/resolve/main/qwen3.5-2b-Q4_K_M.gguf
            sha256: 9a3d0aa6c920f096441139b6a254542da855223fdad06855ea00c6c087fd713d
          - model: Gemma-4-E2B-Q4_0
            expected: generate
            url: https://huggingface.co/ggml-org/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_0.gguf
            sha256: 8e30dff3ac4c8434c49a7036fa15564bdbb6044e42bf04550bf1a096ad7e6a52
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android build and emulator tools
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager"
          "$sdkmanager" 'emulator' 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' 'system-images;android-35;google_apis;x86_64'
          dirname "$sdkmanager" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Build the x86_64 app and instrumentation APK
        run: gradle --no-daemon --max-workers=2 -PsmokeAbi=x86_64 assembleDebug assembleDebugAndroidTest
      - name: Start Android emulator and check boot
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager)"
          "$sdkmanager" --uninstall 'ndk;27.2.12479018' 'cmake;3.22.1'
          cmake -E rm -rf app/.cxx
          df -h "$RUNNER_TEMP"
          export ANDROID_USER_HOME="$RUNNER_TEMP/hino-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/platform-tools/adb" start-server
          printf 'no\n' | "$(dirname "$sdkmanager")/avdmanager" create avd --force --name hino-gguf --package 'system-images;android-35;google_apis;x86_64' --path "$ANDROID_AVD_HOME/hino-gguf.avd"
          test -f "$ANDROID_AVD_HOME/hino-gguf.avd/config.ini"
          if [ ! -f "$ANDROID_AVD_HOME/hino-gguf.ini" ]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/hino-gguf.avd" > "$ANDROID_AVD_HOME/hino-gguf.ini"
          fi
          emulator="$ANDROID_HOME/emulator/emulator"
          "$emulator" -list-avds | grep -Fx hino-gguf
          nohup "$emulator" -avd hino-gguf -no-window -no-boot-anim -no-audio -no-snapshot -camera-back none -camera-front none -feature -Vulkan -gpu software -memory 4096 -cores 2 -partition-size 6144 > "$RUNNER_TEMP/hino-emulator.log" 2>&1 </dev/null &
          pid=$!
          for ((attempt=0; attempt<60; attempt++)); do
            if ! kill -0 "$pid" 2>/dev/null; then
              tail -100 "$RUNNER_TEMP/hino-emulator.log"
              exit 1
            fi
            state=$(timeout 4s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$state" = '1' ]; then
              adb shell getprop ro.product.cpu.abilist
              exit 0
            fi
            sleep 3
          done
          adb devices -l
          tail -100 "$RUNNER_TEMP/hino-emulator.log"
          exit 1
      - name: Install the test APKs
        run: |
          adb install -t app/build/outputs/apk/debug/app-debug.apk
          adb install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Download and verify the reference GGUF
        env:
          MODEL_URL: ${{ matrix.url }}
          MODEL_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 360 --retry 2 --output "$RUNNER_TEMP/reference.gguf" "$MODEL_URL"
          printf '%s  %s\n' "$MODEL_SHA256" "$RUNNER_TEMP/reference.gguf" | sha256sum -c -
          stat -c 'GGUF bytes: %s' "$RUNNER_TEMP/reference.gguf"
      - name: Exercise the real Android JNI and WebView bridge
        env:
          MODEL_NAME: ${{ matrix.model }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          set -euo pipefail
          package=br.com.buscadordehinos.app
          adb shell "run-as $package mkdir -p files"
          adb shell -T "run-as $package sh -c 'cat > files/smoke.gguf'" < "$RUNNER_TEMP/reference.gguf"
          adb shell "run-as $package sha256sum files/smoke.gguf"
          timeout 240s adb shell am instrument -w -e model "$MODEL_NAME" -e expect "$EXPECTED" "$package.test/$package.GgufSmokeRunner" | tee "$RUNNER_TEMP/hino-gguf-result.log"
          grep -q '^INSTRUMENTATION_RESULT: result=PASS' "$RUNNER_TEMP/hino-gguf-result.log"
      - name: Read emulator and app diagnostics
        if: failure()
        run: |
          test ! -f "$RUNNER_TEMP/hino-emulator.log" || tail -80 "$RUNNER_TEMP/hino-emulator.log"
          timeout 8s adb logcat -d -t 400 -s HinoGgufSmoke AndroidRuntime DEBUG || true
