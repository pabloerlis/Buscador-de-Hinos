name: Qwen3 Android experimental APK
on:
  push:
    branches: [feat/qwen3-contextual-android-20261124]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: qwen3-android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Recuperar E5 auditado recente (fallback se expirou)
        id: e5_artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: 45294250230
          name: e5-stanza-assets-qa
          github-token: ${{ github.token }}
          path: app/src/main/assets
      - name: Recuperar indices biblicos auditados recentes (fallback se expirou)
        id: bible_artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: 45294250230
          name: bible-indexes-qa
          github-token: ${{ github.token }}
          path: app/src/main/assets
      - name: Recriar offline assets de fontes fixadas se artefatos expiraram
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s app/src/main/assets/scripture-pt.json ] || [ ! -s app/src/main/assets/bible-graph.json ]; then
            python3 scripts/build_scripture_index.py
            python3 scripts/build_bible_graph.py
            python3 scripts/qa_sources.py
          fi
          if [ ! -s app/src/main/assets/e5-model.onnx ] || [ ! -s app/src/main/assets/e5-vocab.bin ] || [ ! -s app/src/main/assets/e5-index.json ]; then
            python3 -m pip install --disable-pip-version-check -q "numpy==1.26.4" "onnxruntime==1.20.1" "tokenizers==0.20.3" "huggingface_hub==0.27.1" requests
            python3 scripts/build_e5_assets.py
            python3 scripts/qa_e5_android_tokenizer.py
            python3 scripts/qa_e5.py
          fi
          test -s app/src/main/assets/scripture-pt.json
          test -s app/src/main/assets/bible-graph.json
          test -s app/src/main/assets/e5-model.onnx
          test -s app/src/main/assets/e5-vocab.bin
          test -s app/src/main/assets/e5-index.json
      - name: Validate syntax and Android build inputs
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          node tests/qa-qwen3-interface.js
          node tests/test-semantic-tuner.js
          node tests/test-telepatia-sequence.js
          npm install --no-save --package-lock=false --ignore-scripts jsdom@26.1.0
          node tests/qa-qwen3-ranking-ui.js
      - name: Build ARM64 and x86_64 APK with GGUF and E5
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          gradle --no-daemon --stacktrace assembleDebug -PenableLocalEmbeddings=true -PenableLocalModels=true
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Buscador-de-Hinos-v2.6.38-Qwen3-Experimental.apk
          APK=dist/Buscador-de-Hinos-v2.6.38-Qwen3-Experimental.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libhinosllm.so'
          unzip -l "$APK" | grep 'assets/e5-model.onnx'
          if unzip -Z1 "$APK" | grep -E '\.gguf$'; then exit 1; fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: Buscador-Hinos-v2.6.38-Qwen3-Experimental
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish direct APK download as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v2.6.38-qwen3-exp-${GITHUB_SHA:0:8}
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Buscador de Hinos 2.6.38 — Qwen3 experimental" --notes "Compilação experimental para testes manuais. Inclui motor GGUF e E5; Qwen3-4B-Instruct-2507 Q4_K_M é externo. Interface exclusiva GGUF, sem seletor ZIP Laya. Qwen3 governa automaticamente o ranking principal. Gate de interface com ponte de teste controlada: exclusão, mudança de ordem, abstenção, E5 tardio, sliders, paginação e cancelamento. Curadoria integral de até 18 candidatos em duas passagens. Não validado em aparelho físico. Sem aprovação semântica final."
