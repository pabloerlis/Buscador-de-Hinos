name: Generative LLM contextual adjudication - real hymns
on:
  push:
    branches: [experiment/llm-contextual-adjudication-20261124]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  llm_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      QA_SHARD: ${{ matrix.shard }}
      QA_SHARDS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recuperar E5 auditado recente (fallback se expirou)
        id: e5_artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: 45294250230
          name: e5-stanza-assets-qa
          github-token: ${{ github.token }}
          path: app/src/main/assets
      - name: Recuperar indices biblicos auditados recentes (fallback se expirou)
        id: bible_artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: 45294250230
          name: bible-indexes-qa
          github-token: ${{ github.token }}
          path: app/src/main/assets
      - name: Recriar offline assets de fontes fixadas se artefatos expiraram
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s app/src/main/assets/scripture-pt.json ] || [ ! -s app/src/main/assets/bible-graph.json ]; then
            python3 scripts/build_scripture_index.py
            python3 scripts/build_bible_graph.py
            python3 scripts/qa_sources.py
          fi
          if [ ! -s app/src/main/assets/e5-model.onnx ] || [ ! -s app/src/main/assets/e5-vocab.bin ] || [ ! -s app/src/main/assets/e5-index.json ]; then
            python3 -m pip install --disable-pip-version-check -q "numpy==1.26.4" "onnxruntime==1.20.1" "tokenizers==0.20.3" "huggingface_hub==0.27.1" requests
            python3 scripts/build_e5_assets.py
            python3 scripts/qa_e5_android_tokenizer.py
            python3 scripts/qa_e5.py
          fi
          test -s app/src/main/assets/scripture-pt.json
          test -s app/src/main/assets/bible-graph.json
          test -s app/src/main/assets/e5-model.onnx
          test -s app/src/main/assets/e5-vocab.bin
          test -s app/src/main/assets/e5-index.json
      - name: Check Python and JS syntax
        run: |
          python3 -m py_compile scripts/qa_contextual_llm.py
          node --check tests/qa-llm-candidate-pool.js
      - name: Prepare pinned CPU engine and quantized Qwen3 4B
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q "numpy==1.26.4" "onnxruntime==1.20.1" "tokenizers==0.20.3" "huggingface_hub==0.27.1" requests
          mkdir -p "$RUNNER_TEMP/llama"
          curl -fsSL --retry 3 'https://github.com/ggml-org/llama.cpp/releases/download/b6500/llama-b6500-bin-ubuntu-x64.zip' -o "$RUNNER_TEMP/llama.zip"
          echo "716803084e565fe779bc2d01ea576c418be141f8fabac97509bc6d7c3cd786b2  $RUNNER_TEMP/llama.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/llama.zip" -d "$RUNNER_TEMP/llama"
          curl -fsSL --retry 3 'https://huggingface.co/bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF/resolve/5ba9dff/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf' -o "$RUNNER_TEMP/model.gguf"
          echo "2fde00ce69dd4899c70d020845e2638353015bba0fdf161b3eb965f2bca4464e  $RUNNER_TEMP/model.gguf" | sha256sum -c
      - name: Run local LLM and evaluate real catalog
        shell: bash
        run: |
          set -euo pipefail
          engine="$(find "$RUNNER_TEMP/llama" -type f -name llama-server -print -quit)"
          test -n "$engine"
          chmod +x "$engine"
          export LD_LIBRARY_PATH="$(dirname "$engine"):${LD_LIBRARY_PATH:-}"
          "$engine" -m "$RUNNER_TEMP/model.gguf" --host 127.0.0.1 --port 8088 -c 8192 -t "$(nproc)" -np 1 >"$RUNNER_TEMP/llama-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8088/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then echo "Local engine failed to start"; exit 1; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8088/health
          python3 scripts/qa_contextual_llm.py
      - name: Publish only redacted quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-contextual-adjudication-report-${{ matrix.shard }}
          path: qa-report/llm-contextual-adjudication.json
          if-no-files-found: warn
