name: Telepatia Android - compilacao sem LFM3
on:
  push:
    branches: [feat/semantic-sliders-live-20261123]
    paths:
      - app/src/main/java/br/com/buscadordehinos/app/TelepatiaNliEngine.java
      - app/src/main/java/br/com/buscadordehinos/app/MainActivity.java
      - app/src/main/assets/telepatia-*.js
      - tests/test-telepatia-sequence.js
      - app/build.gradle
      - .github/workflows/telepatia-android-compile.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    name: Agente Android NLI | Java compila sem llama.cpp nem GGUF
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Testes de contrato de entrada do Laya em JavaScript
        run: |
          set -euo pipefail
          node --check app/src/main/assets/telepatia-nli-sequence.js
          node tests/test-telepatia-sequence.js
          node tests/test-semantic-tuner.js
      - name: Obter apenas biblioteca de tokenização aprovada por auditoria Rust
        uses: actions/download-artifact@v4
        with:
          name: telepatia-nli-tokenizer-js-reviewed
          run-id: 45288017635
          github-token: ${{ github.token }}
          path: .tmp/tokenizer-js-audited
      - name: Empacotar somente código de tokenização, nunca pesos de IA
        run: |
          set -euo pipefail
          FILE="$(find .tmp/tokenizer-js-audited -type f -name tokenizers.mjs -print -quit)"
          LICENSE="$(find .tmp/tokenizer-js-audited -type f -name LICENSE -print -quit)"
          test -s "$FILE"
          test -s "$LICENSE"
          echo "1c4a848f86156201c033d6cd08c4cf81ae1088552acec3367f31ef086edf5af0  $FILE" | sha256sum -c
          cp "$FILE" app/src/main/assets/telepatia-tokenizers.mjs
          cp "$LICENSE" app/src/main/assets/telepatia-tokenizers-LICENSE.txt
          node --check app/src/main/assets/telepatia-tokenizers.mjs
      - name: SDK Android
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar variant NLI (sem GGUF e sem pesos no APK)
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest \
            -PenableLocalEmbeddings=true -PenableLocalModels=false
          test -s app/build/outputs/apk/debug/app-debug.apk
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Ei '\.gguf|hinosllm|llama\.cpp'; then
            echo "ERROR: unexpected legacy GGUF asset";exit 1
          fi
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          echo "BUILD ONLY. No verified NLI weights or Android inference result."
