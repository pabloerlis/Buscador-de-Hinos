name: Telepatia Android - end-to-end NLI externo offline (sem LFM3)
on:
  push:
    branches: [feat/semantic-sliders-live-20261123, feat/telepatia-neutral-ranking]
    paths:
      - app/src/main/assets/index.html
      - app/src/main/assets/style.css
      - tests/qa-visible-catalog.js
      - qa/e5-visible-query.json
      - app/src/main/assets/semantic-tuner-ui.js
      - app/src/main/assets/semantic-tuner.js
      - app/src/main/assets/telepatia-nli-client.js
      - app/src/main/java/br/com/buscadordehinos/app/MainActivity.java
      - app/src/androidTest/java/br/com/buscadordehinos/app/TelepatiaDeviceSmokeTest.java
      - app/build.gradle
      - tests/test-semantic-tuner.js
      - scripts/qa_telepatia_android_review.py
      - scripts/qa_telepatia_emulator.sh
      - .github/workflows/telepatia-android-device.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android_real_nli:
    name: Agente de dispositivo | Telepatia ONNX com hashes no Android offline
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Recuperar E5 auditado recente (fallback se expirou)
        id: e5_artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: 45294250230
          name: e5-stanza-assets-qa
          github-token: ${{ github.token }}
          path: app/src/main/assets
      - name: Recuperar indices biblicos auditados recentes (fallback se expirou)
        id: bible_artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: 45294250230
          name: bible-indexes-qa
          github-token: ${{ github.token }}
          path: app/src/main/assets
      - name: Recriar offline assets de fontes fixadas se artefatos expiraram
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s app/src/main/assets/scripture-pt.json ] || [ ! -s app/src/main/assets/bible-graph.json ]; then
            python3 scripts/build_scripture_index.py
            python3 scripts/build_bible_graph.py
            python3 scripts/qa_sources.py
          fi
          if [ ! -s app/src/main/assets/e5-model.onnx ] || [ ! -s app/src/main/assets/e5-vocab.bin ] || [ ! -s app/src/main/assets/e5-index.json ]; then
            python3 -m pip install --disable-pip-version-check -q "numpy==1.26.4" "onnxruntime==1.20.1" "tokenizers==0.20.3" "huggingface_hub==0.27.1" requests
            python3 scripts/build_e5_assets.py
            python3 scripts/qa_e5_android_tokenizer.py
            python3 scripts/qa_e5.py
          fi
          test -s app/src/main/assets/scripture-pt.json
          test -s app/src/main/assets/bible-graph.json
          test -s app/src/main/assets/e5-model.onnx
          test -s app/src/main/assets/e5-vocab.bin
          test -s app/src/main/assets/e5-index.json
      - name: Conferir os resultados exibidos na coletânea de 2018
        run: |
          set -euo pipefail
          catalog="$RUNNER_TEMP/coletanea.json"
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/italozaina/projection-html5-icm/da8e75932982123301affce688e45b4152c9e06e/data/data.json' -o "$catalog"
          echo "57d42fb0bcc881a62b210dd1a3972822d2c39856f7a01278e104d407bf1b747a  $catalog" | sha256sum -c
          npm install --prefix "$RUNNER_TEMP/ui-qa" jsdom@26.1.0 fake-indexeddb@6.2.4
          export NODE_PATH="$RUNNER_TEMP/ui-qa/node_modules"
          node tests/qa-visible-catalog.js "$catalog"
          node tests/qa-visible-catalog.js "$catalog" qa/e5-visible-query.json
          node tests/qa-metrics.js "$catalog"
      - name: Codigo tokenizer auditado independentemente (sem pesos)
        uses: actions/download-artifact@v4
        with:
          run-id: 45288017635
          name: telepatia-nli-tokenizer-js-reviewed
          github-token: ${{ github.token }}
          path: .tmp/tokenizer-lib
      - name: Preparar tokenizer puro JS e verifica-lo por SHA
        run: |
          set -euo pipefail
          FILE="$(find .tmp/tokenizer-lib -type f -name tokenizers.mjs -print -quit)"
          test -s "$FILE"
          echo "1c4a848f86156201c033d6cd08c4cf81ae1088552acec3367f31ef086edf5af0  $FILE" | sha256sum -c
          cp "$FILE" app/src/main/assets/telepatia-tokenizers.mjs
          cp "$(find .tmp/tokenizer-lib -type f -name LICENSE -print -quit)" app/src/main/assets/telepatia-tokenizers-LICENSE.txt
          node --check app/src/main/assets/telepatia-tokenizers.mjs
          node tests/test-telepatia-sequence.js
          node tests/test-semantic-tuner.js
      - name: Baixar exportacao Telepatia ONNX aprovada (apenas para teste, fora do APK)
        uses: actions/download-artifact@v4
        with:
          run-id: 45289501549
          name: telepatia-nli-onnx-external-fp32
          github-token: ${{ github.token }}
          path: .tmp/nli-model
      - name: Arquivos externos autenticados e caso de inferencia com tokenizer auditado
        run: |
          set -euo pipefail
          mkdir -p .tmp/device-transfer
          python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          roots=list(Path('.tmp/nli-model').rglob('model.onnx'))
          assert len(roots)==1,roots
          base=roots[0].parent
          for name in ('model.onnx','model.onnx.data','tokenizer/tokenizer.json',
                       'tokenizer/tokenizer_config.json','rl_agent_config.json','manifest.json'):
              f=base/name
              assert f.is_file() and f.stat().st_size>0,name
          manifest=json.loads((base/'manifest.json').read_text())
          assert manifest['model']=='telepatia-ai/laya-pt-es-nli'
          assert manifest['status']=='verified'
          for name,field in (('model.onnx','onnx_sha256'),
                            ('model.onnx.data','sidecar_sha256'),
                            ('tokenizer/tokenizer.json','tokenizer_sha256')):
              h=hashlib.file_digest(open(base/name,'rb'),'sha256').hexdigest()
              assert h==manifest[field],name
          Path('.tmp/device-transfer/model-root.txt').write_text(str(base.resolve()))
          print('EXTERNAL_MODEL_OK',base,manifest['revision'],flush=True)
          PY
          MODEL_ROOT="$(cat .tmp/device-transfer/model-root.txt)"
          MODEL_ROOT="$MODEL_ROOT" node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createRequire} from 'node:module';
          import {pathToFileURL} from 'node:url';
          const require=createRequire(import.meta.url);
          const {Tokenizer}=await import(pathToFileURL(process.cwd()+'/app/src/main/assets/telepatia-tokenizers.mjs').href);
          const sequence=require('./app/src/main/assets/telepatia-nli-sequence.js');
          const root=process.env.MODEL_ROOT;
          const tok=new Tokenizer(JSON.parse(fs.readFileSync(root+'/tokenizer/tokenizer.json','utf8')),
            JSON.parse(fs.readFileSync(root+'/tokenizer/tokenizer_config.json','utf8')));
          const [item]=sequence.sequence(tok,'Um gato dorme no sofá.','Um animal está dormindo.');
          if(!item||item.marker_pos.length!==3)throw Error('Invalid reference NLI input');
          fs.writeFileSync('.tmp/device-transfer/telepatia-golden.json',JSON.stringify({
            input_ids:item.input_ids,marker_pos:item.marker_pos,expected_label:'entailment'
          }));
          console.log('NLI_QA_INPUT_TOKENS',item.input_ids.length);
          JS
          mkdir -p .tmp/device-bundle/telepatia-pt-es-nli
          cp -r "$MODEL_ROOT"/. .tmp/device-bundle/telepatia-pt-es-nli/
          cd .tmp/device-bundle
          zip -0 -q -r ../device-transfer/telepatia.zip telepatia-pt-es-nli
          cd -
          test "$(wc -c < .tmp/device-transfer/telepatia.zip)" -gt 400000000
      - name: Android SDK e compilacao sem GGUF
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          gradle --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest \
            -PenableLocalEmbeddings=true -PenableLocalModels=false
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Ei '\.gguf|hinosllm|libllama';then
            echo "FAIL legacy LFM3/GGUF bundled";exit 1
          fi
          mkdir -p qa-report
          sha256sum app/build/outputs/apk/debug/app-debug.apk > qa-report/telepatia-apk.sha256
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar APK e modelo externo no Android e classificar offline
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 6144M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/qa_telepatia_emulator.sh
      - name: Agente 8 independente - revisar APK, hashes e provas de inferencia
        run: |
          set -euo pipefail
          python3 scripts/qa_telepatia_android_review.py
      - name: Laudo APK e prova offline de inferencia sem LFM3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: telepatia-android-offline-device-reviewed
          path: |
            qa-report/telepatia-apk.sha256
            qa-report/telepatia-android-device.log
            qa-report/telepatia-independent-review.json
          retention-days: 30
          if-no-files-found: error
      - name: Publicar o MESMO ZIP do modelo instalado no Android offline
        if: success()
        run: |
          set -euo pipefail
          cd .tmp/device-transfer
          sha256sum telepatia.zip > telepatia.zip.sha256
      - name: Disponibilizar ZIP de instalacao testado sem reempacotar o modelo
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telepatia-modelo-ZIP-instalação-testada
          path: |
            .tmp/device-transfer/telepatia.zip
            .tmp/device-transfer/telepatia.zip.sha256
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: APK candidato APENAS se inferencia real offline aprovou
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Buscador-Hinos-v2.6.35-Telepatia-NLI-Android-QA
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
